# Auctaryn — local Docker Compose profile.
# Production must use docker-compose.production.yml with a verified release digest.
# ThreatFade and OpenShell are external services; this repo contains their clients/adapters.

services:
  api:
    image: ${AUCTARYN_IMAGE:-auctaryn:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8400:8400"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUCTARYN_API_KEY: ${AUCTARYN_API_KEY:?Set AUCTARYN_API_KEY in your environment}
      AUCTARYN_ADMIN_API_KEY: ${AUCTARYN_ADMIN_API_KEY:?Set AUCTARYN_ADMIN_API_KEY in your environment}
      AUCTARYN_REQUIRE_STRONG_API_KEYS: ${AUCTARYN_REQUIRE_STRONG_API_KEYS:-true}
      AUCTARYN_EVIDENCE_DB: ${AUCTARYN_EVIDENCE_DB:-/app/data/evidence.sqlite3}
      AUCTARYN_EVIDENCE_HMAC_KEY: ${AUCTARYN_EVIDENCE_HMAC_KEY:-}
      AUCTARYN_EVIDENCE_HMAC_KEY_FILE: ""
      AUCTARYN_CORS_ORIGINS: ${AUCTARYN_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUCTARYN_RUNTIME_ADAPTER: ${AUCTARYN_RUNTIME_ADAPTER:-}
      AUCTARYN_RELEASE_TAG: ${AUCTARYN_RELEASE_TAG:-}
      OPENSHELL_SANDBOX_NAME: ${OPENSHELL_SANDBOX_NAME:-}
      OPENSHELL_WORKSPACE: ${OPENSHELL_WORKSPACE:-default}
      OPENSHELL_EXECUTION_TIMEOUT_SECONDS: ${OPENSHELL_EXECUTION_TIMEOUT_SECONDS:-60}
      OPENSHELL_OIDC_ISSUER: ${OPENSHELL_OIDC_ISSUER:-}
      OPENSHELL_OIDC_CLIENT_ID: ${OPENSHELL_OIDC_CLIENT_ID:-}
      OPENSHELL_OIDC_CLIENT_SECRET: ${OPENSHELL_OIDC_CLIENT_SECRET:-}
      OPENSHELL_OIDC_AUDIENCE: ${OPENSHELL_OIDC_AUDIENCE:-}
      OPENSHELL_ALLOW_USER_CREDENTIALS: ${OPENSHELL_ALLOW_USER_CREDENTIALS:-false}
      THREATFADE_SERVICE_URL: ${THREATFADE_SERVICE_URL:?Set THREATFADE_SERVICE_URL to your ThreatFade service}
      THREATFADE_SERVICE_TOKEN: ${THREATFADE_SERVICE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - auctaryn-data:/app/data
      - auctaryn-logs:/app/logs
      - ./config:/app/config:ro
      - ./policies:/app/policies:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    networks:
      - auctaryn

networks:
  auctaryn:
    driver: bridge

volumes:
  auctaryn-data:
  auctaryn-logs:
