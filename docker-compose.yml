# Auctaryn — Docker Compose
# ThreatFade is an external service; this repository contains the client/adapter only.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8400:8400"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUCTARYN_API_KEY=${AUCTARYN_API_KEY:?Set AUCTARYN_API_KEY in your environment}
      - AUCTARYN_ADMIN_API_KEY=${AUCTARYN_ADMIN_API_KEY:?Set AUCTARYN_ADMIN_API_KEY in your environment}
      - AUCTARYN_CORS_ORIGINS=${AUCTARYN_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - THREATFADE_SERVICE_URL=${THREATFADE_SERVICE_URL:?Set THREATFADE_SERVICE_URL to your ThreatFade service}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./policies:/app/policies:ro
    restart: unless-stopped
    networks:
      - auctaryn

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8400
      - VITE_WS_URL=ws://localhost:8400
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - auctaryn

networks:
  auctaryn:
    driver: bridge

volumes:
  auctaryn-data:
