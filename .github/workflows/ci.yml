name: Auctaryn CI

on:
  push:
    branches: [main, develop, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=core --cov=api --cov=modules --cov-report=term-missing

      - name: Lint check
        run: |
          pip install ruff
          ruff check --select E4,E7,E9,F core/ api/ modules/

      - name: Python dependency audit
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

  dashboard-and-container:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Validate deployment and rollback script syntax
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/rollback.sh

      - name: Validate local Compose configuration
        env:
          AUCTARYN_API_KEY: ci-service-key-that-is-long-enough
          AUCTARYN_ADMIN_API_KEY: ci-admin-key-that-is-different
          THREATFADE_SERVICE_URL: https://threatfade.example.invalid
          THREATFADE_SERVICE_TOKEN: ci-threatfade-token
        run: docker compose config --quiet

      - name: Validate production Compose override
        env:
          AUCTARYN_API_KEY: ci-service-key-that-is-long-enough
          AUCTARYN_ADMIN_API_KEY: ci-admin-key-that-is-different
          THREATFADE_SERVICE_URL: https://threatfade.example.invalid
          THREATFADE_SERVICE_TOKEN: ci-threatfade-token
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/openshell/gateways/ci"
          printf '%064d\n' 0 > "$temp_dir/evidence-hmac.key"
          printf 'ci\n' > "$temp_dir/openshell/active_gateway"
          printf '{"endpoint":"https://openshell.example.invalid"}\n' > "$temp_dir/openshell/gateways/ci/metadata.json"
          export AUCTARYN_IMAGE="ghcr.io/lloydcoder/auctaryn@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export AUCTARYN_EVIDENCE_HMAC_KEY_FILE="$temp_dir/evidence-hmac.key"
          export OPENSHELL_SYSTEM_GATEWAY_DIR="$temp_dir/openshell"
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

      - name: Build API image
        run: docker build -t auctaryn:latest .

      - name: Verify API liveness
        run: |
          docker run -d --name auctaryn-test --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/data:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001 \
            --tmpfs /app/logs:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001 \
            -p 127.0.0.1:8400:8400 auctaryn:latest
          sleep 5
          curl -f http://127.0.0.1:8400/health
          docker stop auctaryn-test
