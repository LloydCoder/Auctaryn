name: Auctaryn CI

on:
  push:
    branches: [main, develop, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=core --cov=api --cov=modules --cov-report=term-missing

      - name: Lint check
        run: |
          pip install ruff
          ruff check --select E4,E7,E9,F core/ api/ modules/

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t auctaryn:latest .

      - name: Verify container starts
        run: |
          docker run -d --name auctaryn-test -p 8400:8400 twinguard:latest
          sleep 5
          curl -f http://localhost:8400/health || exit 1
          docker stop auctaryn-test
