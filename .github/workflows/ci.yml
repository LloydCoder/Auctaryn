name: Auctaryn CI

on:
  push:
    branches: [main, develop, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=core --cov=api --cov=modules --cov-report=term-missing

      - name: Lint check
        run: |
          pip install ruff
          ruff check --select E4,E7,E9,F core/ api/ modules/

      - name: Python dependency audit
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  dashboard-and-container:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Validate deployment script syntax
        run: bash -n scripts/deploy.sh

      - name: Validate Compose configuration
        env:
          AUCTARYN_API_KEY: ci-service-key-that-is-long-enough
          AUCTARYN_ADMIN_API_KEY: ci-admin-key-that-is-different
          THREATFADE_SERVICE_URL: https://threatfade.example.invalid
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -t auctaryn:latest .

      - name: Verify API liveness
        run: |
          docker run -d --name auctaryn-test --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/data:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001 \
            --tmpfs /app/logs:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001 \
            -p 127.0.0.1:8400:8400 auctaryn:latest
          sleep 5
          curl -f http://127.0.0.1:8400/health
          docker stop auctaryn-test
