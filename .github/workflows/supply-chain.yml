name: Secure software supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Historical and change-set secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan exact pull-request/push change set
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              range="$PUSH_AFTER"
            else
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          else
            echo "Unsupported event for change-set scan" >&2
            exit 1
          fi
          printf 'Scanning Gitleaks change-set range: %s\n' "$range"
          gitleaks detect --source . --redact --exit-code=2 --report-format=sarif --report-path=results.sarif --log-opts="$range"
      - name: Scan full history reachable from this ref
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --exit-code=2 --report-format=sarif --report-path=history-results.sarif --log-opts="$GITHUB_SHA"
      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results
          path: |
            results.sarif
            history-results.sarif
          if-no-files-found: ignore

  sbom-and-container:
    name: Dependency audit, SBOM and container scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install exact dashboard dependency graph
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Audit dashboard dependencies including development tooling
        working-directory: dashboard
        run: npm audit --audit-level=high
      - name: Build API container
        run: docker build --pull --tag auctaryn:ci .
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: auctaryn-source.spdx.json
          artifact-name: auctaryn-source-sbom
          upload-artifact: false
          upload-release-assets: false
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: auctaryn:ci
          format: spdx-json
          output-file: auctaryn-container.spdx.json
          artifact-name: auctaryn-container-sbom
          upload-artifact: false
          upload-release-assets: false
      - name: Block fixable high and critical container vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: auctaryn:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Record complete container vulnerability inventory
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: auctaryn:ci
          fail-build: false
          # Keep the full report unfiltered so the independent audit can see high
          # and critical findings regardless of whether a fix is available.
          severity-cutoff: negligible
          only-fixed: false
          output-format: json
          output-file: grype-full.json
      - name: Independently audit the full vulnerability inventory
        run: python scripts/audit_grype_report.py grype-full.json
      - name: Export exact CI image for provenance
        run: docker save --output auctaryn-image.tar auctaryn:ci
      - name: Upload SBOMs and tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auctaryn-supply-chain
          path: |
            auctaryn-source.spdx.json
            auctaryn-container.spdx.json
            grype-full.json
            auctaryn-image.tar
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest tested supply-chain artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: sbom-and-container
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auctaryn-supply-chain
      - name: Attest source SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: auctaryn-source.spdx.json
      - name: Attest container SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: auctaryn-container.spdx.json
      - name: Attest exact CI container image archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: auctaryn-image.tar
